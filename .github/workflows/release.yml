name: Build Windows packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Validate version and tag
        shell: bash
        run: python3 packaging/version.py >> "$GITHUB_OUTPUT"

  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Select MSVC and Windows SDK
        run: ./packaging/windows/toolchain.ps1
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Test release scripts
        run: python -m unittest discover -s packaging -p "test_*.py"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            channel: win-x64
            msvc_component: x86.x64
            msvc_arch: amd64
          - target: aarch64-pc-windows-msvc
            channel: win-arm64
            msvc_component: ARM64
            msvc_arch: arm64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_CHANNEL: ${{ matrix.channel }}
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Select matching MSVC and Windows SDK
        run: ./packaging/windows/toolchain.ps1 -Architecture ${{ matrix.msvc_arch }} -Component ${{ matrix.msvc_component }}
      - name: Build portable application
        # Keep Cargo outside Git Bash so coreutils link.exe cannot shadow MSVC.
        run: cargo build --locked --release --target $env:BUILD_TARGET --bin suki-toolbox
      - name: Pack application
        run: python packaging/pack.py $env:BUILD_VERSION $env:BUILD_TARGET "$env:RUNNER_TEMP/packages"
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.channel }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare, check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: packages
      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 packaging/release.py "$BUILD_VERSION" "$GITHUB_REF_NAME" packages
