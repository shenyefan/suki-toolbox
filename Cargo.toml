[package]
name = "suki-toolbox"
version = "0.1.0"
edition = "2024"
authors = ["Moenya"]
description = "Suki Toolbox - Windows 工具箱"

[build-dependencies]
embed-resource = "3.0.12"

[dependencies]
gpui-kit = "0.9.0"
image = { version = "0.25", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Wmi", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[dev-dependencies]
gpui-kit = { version = "0.9.0", features = ["test-support"] }
tempfile = "3"
